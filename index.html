<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéChain</title>
    <link href="https://cdn.jsdelivr.net/npm/fontsource-inter@5.0.16/index.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
</head>
<body>
    <div class="container">
        <header>
            <div class="logo" onclick="navigateTo('')">PokéChain</div>
            <div class="subtitle">Spoiler-free evolution chain tracker</div>
        </header>

        <div class="search-wrapper">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" class="search-input" id="searchInput" placeholder="Search a Pokémon..." autocomplete="off" spellcheck="false">
            <div class="search-spinner" id="searchSpinner"><div class="spinner"></div></div>
            <div class="suggestions" id="suggestions"></div>
        </div>

        <div class="settings-row">
            <label class="toggle-wrapper">
                <input type="checkbox" id="autocompleteToggle">
                <span class="toggle-track"></span>
                <span>Enable autocomplete</span>
            </label>
        </div>
        
        <div class="error-msg" id="errorMsg"></div>
        <div id="results"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
