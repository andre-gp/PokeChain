<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéChain</title>
    <link href="https://cdn.jsdelivr.net/npm/fontsource-inter@5.0.16/index.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #7c6fe8;
            --accent-hover: #9085f5;
            --accent-glow: rgba(124, 111, 232, 0.3);
            --success: #3fb950;
            --warning: #d29922;
            --danger: #f85149;
            --normal: #a8a77a;
            --fire: #ee8130;
            --water: #6390f0;
            --electric: #f7d02c;
            --grass: #7ac74c;
            --ice: #96d9d6;
            --fighting: #c22e28;
            --poison: #a33ea1;
            --ground: #e2bf65;
            --flying: #a98ff3;
            --psychic: #f95587;
            --bug: #a6b91a;
            --rock: #b6a136;
            --ghost: #735797;
            --dragon: #6f35fc;
            --dark: #705746;
            --steel: #b7b7ce;
            --fairy: #d685ad;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 720px;
            padding: 0 20px;
        }

        header {
            text-align: center;
            padding: 60px 0 40px;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #7c6fe8, #f95587);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .logo:hover {
            opacity: 0.8;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Search */
        .search-wrapper {
            position: relative;
            margin: 30px 0 16px;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 52px;
            font-size: 1.05rem;
            font-family: inherit;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .search-spinner {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
        }

        .search-spinner.active {
            display: block;
        }

        /* Autocomplete toggle */
        .settings-row {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 24px;
            margin-left: 10px;
        }

        .toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .toggle-wrapper input {
            display: none;
        }

        .toggle-track {
            width: 40px;
            height: 22px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            position: relative;
            transition: all 0.2s;
        }

        .toggle-track::after {
            content: '';
            position: absolute;
            left: 2px;
            top: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text-secondary);
            transition: all 0.2s;
        }

        .toggle-wrapper input:checked + .toggle-track {
            background: var(--accent);
            border-color: var(--accent);
        }

        .toggle-wrapper input:checked + .toggle-track::after {
            transform: translateX(18px);
            background: #fff;
        }

        /* Suggestions dropdown */
        .suggestions {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            max-height: 260px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }

        .suggestions.visible {
            display: block;
        }

        .suggestion-item {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.15s;
            border-bottom: 1px solid var(--border-color);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover, .suggestion-item.active {
            background: var(--bg-tertiary);
        }

        .suggestion-item img {
            width: 36px;
            height: 36px;
            image-rendering: pixelated;
        }

        .suggestion-name {
            text-transform: capitalize;
            font-weight: 500;
        }

        .suggestion-id {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-left: auto;
        }

        /* Error */
        .error-msg {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.3);
            color: var(--danger);
            padding: 14px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .error-msg.visible {
            display: block;
        }

        /* Result Card */
        .result-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            animation: fadeSlideUp 0.4s ease;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pokemon-header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 24px;
        }

        .pokemon-sprite {
            width: 120px;
            height: 120px;
            image-rendering: pixelated;
            flex-shrink: 0;
            filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4));
        }

        .pokemon-info {
            flex: 1;
        }

        .pokemon-name {
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: capitalize;
            margin-bottom: 4px;
        }

        .pokemon-id {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .type-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .type-badge {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .divider {
            height: 1px;
            background: var(--border-color);
            margin: 24px 0;
        }

        /* Evolution Section */
        .evolution-section h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .evolution-section h3 .icon {
            font-size: 1.2rem;
        }

        .no-evolution {
            color: var(--success);
            font-weight: 500;
            padding: 16px;
            background: rgba(63, 185, 80, 0.08);
            border-radius: 12px;
            text-align: center;
        }

        .evo-branch {
            margin-bottom: 16px;
        }

        .evo-branch:last-child {
            margin-bottom: 0;
        }

        .evo-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .evo-arrow {
            color: var(--accent);
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .evo-card {
            flex: 1;
            min-width: 200px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            transition: all 0.2s;
        }

        .evo-card:hover {
            border-color: var(--accent);
        }

        .evo-target-name {
            font-weight: 600;
            font-size: 1.05rem;
            text-transform: capitalize;
            cursor: pointer;
            color: var(--accent);
        }

        .evo-target-name:hover {
            text-decoration: underline;
        }

        .evo-name-row {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 24px;
        }

        .evo-hidden-text {
            color: var(--text-secondary);
            font-style: italic;
        }

        .btn-reveal-evo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 8px;
            font-size: 0.85rem;
            background: var(--bg-primary);
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .btn-reveal-evo:hover {
            color: var(--accent);
            background: var(--bg-primary);
        }

        .evo-method {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .evo-method .method-label {
            font-weight: 600;
            color: var(--warning);
        }

        /* Spoiler */
        .spoiler-content {
            margin-top: 10px;
            padding: 12px;
            background: rgba(124, 111, 232, 0.08);
            border-radius: 10px;
            border: 1px dashed var(--accent);
            font-size: 0.88rem;
            color: var(--text-secondary);
            display: none;
        }

        .spoiler-content.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .spoiler-content strong {
            color: var(--text-primary);
        }

        /* Buttons */
        .btn-reveal {
            margin-top: 10px;
            padding: 7px 14px;
            font-size: 0.82rem;
            font-family: inherit;
            font-weight: 600;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reveal:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--bg-secondary);
        }

        .btn-reveal.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Loading spinner */
        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Breadcrumb */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .breadcrumb a {
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
            text-transform: capitalize;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .breadcrumb .sep {
            color: var(--border-color);
        }

        .breadcrumb .current {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 0;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        /* Responsive */
        @media (max-width: 520px) {
            header { padding: 40px 0 30px; }
            .logo { font-size: 1.7rem; }
            .pokemon-header { flex-direction: column; text-align: center; }
            .type-badges { justify-content: center; }
            .pokemon-sprite { width: 100px; height: 100px; }
            .result-card { padding: 20px; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo" onclick="navigateTo('')">PokéChain</div>
            <div class="subtitle">Spoiler-free evolution chain tracker</div>
        </header>

        <div class="search-wrapper">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" class="search-input" id="searchInput" placeholder="Search a Pokémon..." autocomplete="off" spellcheck="false">
            <div class="search-spinner" id="searchSpinner"><div class="spinner"></div></div>
            <div class="suggestions" id="suggestions"></div>
        </div>

        <div class="settings-row">
            <label class="toggle-wrapper">
                <input type="checkbox" id="autocompleteToggle">
                <span class="toggle-track"></span>
                <span>Enable autocomplete</span>
            </label>
        </div>
        
        <div class="error-msg" id="errorMsg"></div>
        <div id="results"></div>

        <footer>
            Data provided by <a href="https://pokeapi.co/" target="_blank" rel="noopener">PokéAPI</a>
        </footer>
    </div>

    <script>
        const TYPE_COLORS = {
            normal: '#a8a77a', fire: '#ee8130', water: '#6390f0', electric: '#f7d02c',
            grass: '#7ac74c', ice: '#96d9d6', fighting: '#c22e28', poison: '#a33ea1',
            ground: '#e2bf65', flying: '#a98ff3', psychic: '#f95587', bug: '#a6b91a',
            rock: '#b6a136', ghost: '#735797', dragon: '#6f35fc', dark: '#705746',
            steel: '#b7b7ce', fairy: '#d685ad', unknown: '#787878'
        };

        // Local caching layer to reduce API requests, optimized to store only necessary fields
        const PokeCache = {
            prefix: 'pokeapi_cache_v2_',
            timeToStale: 24 * 60 * 60 * 1000, // 24 hours
            get(url) {
                try {
                    const key = this.prefix + url;
                    const cached = localStorage.getItem(key);
                    if (cached) {
                        const { data, cachedAt } = JSON.parse(cached);
                        if (Date.now() - cachedAt > this.timeToStale) {
                            localStorage.removeItem(key);
                            return null;
                        } else {
                            return data;
                        }
                    }
                } catch (e) {
                    console.warn('Cache read error', e); 
                }

                return null;
            },
            set(url, data) {
                const item = { data, cachedAt: Date.now() };

                try {
                    localStorage.setItem(this.prefix + url, JSON.stringify(item));
                } catch (e) {
                    console.warn('Cache full or quota exceeded');
                    this.clearOld();
                    try {
                        localStorage.setItem(this.prefix + url, JSON.stringify(item));
                    }
                    catch (e2) {
                        console.error('Cache still full after clearing');
                    }
                }
            },
            clearOld() {
                console.log("[CACHE] Clearing old cache data.")
                const keys = Object.keys(localStorage).filter(k => k.startsWith(this.prefix));
                // Remove half of oldest caches if quota hit
                keys.sort((a, b) => {
                    const ta = JSON.parse(localStorage.getItem(a)).cachedAt;
                    const tb = JSON.parse(localStorage.getItem(b)).cachedAt;
                    return ta - tb;
                });
                const toRemove = keys.slice(0, Math.ceil(keys.length / 2));
                toRemove.forEach(k => localStorage.removeItem(k));
            },
            clear() {
                console.log("[CACHE] Clearing all cache data.")
                Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => localStorage.removeItem(k));
            }
        };

        // Cached fetch wrapper
        async function cachedFetch(url, stripFn) {
            const cached = PokeCache.get(url);

            if (cached) {
                console.log("Successfully retrieved cached object for " + url);
                return cached;
            } else {
                const res = await fetch(url);

                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }
                
                const data = await res.json();
                const toCache = stripFn ? stripFn(data) : data;
                PokeCache.set(url, toCache);
                console.log("Found no cache for" + url + ". Sucessfully updated the cache data for it.");
                return toCache;
            }
        }

        // Strip functions to minimize localStorage footprint
        const stripPokemonList = (data) => data.results.map(r => ({ name: r.name, url: r.url }));

        const stripSpecies = (data) => ({ evolution_chain_url: data.evolution_chain.url });

        const stripPokemon = (data) => ({
            id: data.id,
            name: data.name,
            sprite: data.sprites.other['official-artwork']?.front_default || data.sprites.front_default,
            types: data.types.map(t => t.type.name)
        });

        function stripEvolutionDetails(details) {
            return details.map(d => ({
                trigger: d.trigger?.name,
                min_level: d.min_level,
                item: d.item?.name,
                known_move: d.known_move?.name,
                known_move_type: d.known_move_type?.name,
                trade_species: d.trade_species?.name,
                min_happiness: d.min_happiness,
                min_beauty: d.min_beauty,
                min_affection: d.min_affection,
                needs_overworld_rain: d.needs_overworld_rain,
                time_of_day: d.time_of_day,
                relative_physical_stats: d.relative_physical_stats,
                party_type: d.party_type,
                party_species: d.party_species?.name,
                gender: d.gender,
                location: d.location?.name,
                held_item: d.held_item?.name,
                turn_upside_down: d.turn_upside_down
            }));
        }

        function stripChainNode(node) {
            return {
                species_name: node.species.name,
                evolution_details: stripEvolutionDetails(node.evolution_details),
                evolves_to: node.evolves_to.map(child => stripChainNode(child))
            };
        }

        const stripEvolutionChain = (data) => stripChainNode(data.chain);

        let allPokemonNames = [];
        let searchTimeout = null;
        let activeSuggestionIndex = -1;
        let autocompleteEnabled = localStorage.getItem('pokechain_autocomplete') === 'true';

        const searchInput = document.getElementById('searchInput');
        const searchSpinner = document.getElementById('searchSpinner');
        const suggestionsDiv = document.getElementById('suggestions');
        const errorMsg = document.getElementById('errorMsg');
        const resultsDiv = document.getElementById('results');
        const autocompleteToggle = document.getElementById('autocompleteToggle');

        autocompleteToggle.checked = autocompleteEnabled;
        autocompleteToggle.addEventListener('change', () => {
            autocompleteEnabled = autocompleteToggle.checked;
            localStorage.setItem('pokechain_autocomplete', autocompleteEnabled);
            if (!autocompleteEnabled) {
                suggestionsDiv.classList.remove('visible');
                activeSuggestionIndex = -1;
            }
        });

        // Routing Helper (Hash-based for static servers)
        function navigateTo(name) {
            const cleanName = name ? name.trim().toLowerCase().replace(/[^a-z0-9-]/g, '') : '';
            
            window.location.hash = cleanName;
        }

        // Handle Route Change
        function handleRoute() {
            const hash = window.location.hash.replace('#', '');
            if (hash) {
                searchInput.value = hash;
                searchPokemon(hash);
            } else {
                clearResults();
            }
        }

        // Listen for hash changes (Back/Forward buttons)
        window.addEventListener('hashchange', handleRoute);

        // Handle initial load
        window.addEventListener('DOMContentLoaded', handleRoute);

        function clearResults() {
            searchInput.value = '';
            resultsDiv.innerHTML = '';
            errorMsg.classList.remove('visible');
        }

        // Fetch all pokemon list for autocomplete
        async function loadPokemonList() {
            try {
                const data = await cachedFetch('https://pokeapi.co/api/v2/pokemon?limit=1025', stripPokemonList);
                allPokemonNames = data.map(p => {
                    const idMatch = p.url.match(/\/(\d+)\//);
                    return { 
                        name: p.name,
                        url: p.url,
                        id: idMatch ? parseInt(idMatch[1]) : 0
                    };
                });
            } catch (e) {
                console.warn('Failed to load pokemon list for autocomplete', e);
            }
        }

        loadPokemonList();

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.trim().toLowerCase();
            clearTimeout(searchTimeout);
            if (val.length < 2 || allPokemonNames.length === 0 || !autocompleteEnabled) {
                suggestionsDiv.classList.remove('visible');
                return;
            }
            searchTimeout = setTimeout(() => {
                showSuggestions(val);
            }, 150);
        });

        searchInput.addEventListener('keydown', (e) => {
            const items = suggestionsDiv.querySelectorAll('.suggestion-item');
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (!suggestionsDiv.classList.contains('visible')) return;
                activeSuggestionIndex = Math.min(activeSuggestionIndex + 1, items.length - 1);
                updateActiveSuggestion(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (!suggestionsDiv.classList.contains('visible')) return;
                activeSuggestionIndex = Math.max(activeSuggestionIndex - 1, 0);
                updateActiveSuggestion(items);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                const val = searchInput.value.trim().toLowerCase();
                if (val.length > 0) {
                    suggestionsDiv.classList.remove('visible');
                    if (activeSuggestionIndex >= 0 && items[activeSuggestionIndex]) {
                        navigateTo(items[activeSuggestionIndex].dataset.name);
                    } else {
                        navigateTo(val);
                    }
                    activeSuggestionIndex = -1;
                }
            } else if (e.key === 'Escape') {
                suggestionsDiv.classList.remove('visible');
                activeSuggestionIndex = -1;
            }
        });

        function updateActiveSuggestion(items) {
            items.forEach((item, i) => {
                item.classList.toggle('active', i === activeSuggestionIndex);
            });
        }

        function showSuggestions(query) {
            const matches = allPokemonNames
                .filter(p => p.name.includes(query))
                .slice(0, 8);

            if (matches.length === 0) {
                suggestionsDiv.classList.remove('visible');
                return;
            }

            suggestionsDiv.innerHTML = matches.map(p => `
                <div class="suggestion-item" data-name="${p.name}">
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png" alt="" loading="lazy">
                    <span class="suggestion-name">${p.name}</span>
                    <span class="suggestion-id">#${String(p.id).padStart(3, '0')}</span>
                </div>
            `).join('');

            suggestionsDiv.querySelectorAll('.suggestion-item').forEach(item => {
                item.addEventListener('click', () => {
                    navigateTo(item.dataset.name);
                    suggestionsDiv.classList.remove('visible');
                });
            });

            suggestionsDiv.classList.add('visible');
            activeSuggestionIndex = -1;
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrapper')) {
                suggestionsDiv.classList.remove('visible');
                activeSuggestionIndex = -1;
            }
        });

        async function searchPokemon(name) {
            const cleanName = name.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
            if (!cleanName) return;

            // Update input value if called directly via URL hash
            if (searchInput.value !== cleanName) {
                searchInput.value = cleanName;
            }

            suggestionsDiv.classList.remove('visible');
            activeSuggestionIndex = -1;
            errorMsg.classList.remove('visible');
            resultsDiv.innerHTML = '';
            searchSpinner.classList.add('active');
            try {
                const speciesData = await cachedFetch(`https://pokeapi.co/api/v2/pokemon-species/${cleanName}`, stripSpecies);
                const pokemonData = await cachedFetch(`https://pokeapi.co/api/v2/pokemon/${cleanName}`, stripPokemon);
                const evoChainData = await cachedFetch(speciesData.evolution_chain_url, stripEvolutionChain);
                renderResults(speciesData, pokemonData, evoChainData);
            } catch (err) {
                if (err.message.includes('404') || err.message.includes('400')) {
                    showError(`Pokémon "${cleanName}" not found. Please check the spelling.`);
                } else {
                    showError('An error occurred. Please try again.');
                }
            } finally {
                searchSpinner.classList.remove('active');
            }
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('visible');
        }

        function renderResults(speciesData, pokemonData, evoChainData) {
            const pName = pokemonData.name;
            const pId = pokemonData.id;
            const pSprite = pokemonData.sprite;
            const pTypes = pokemonData.types;
            const evoInfo = findEvolutionInChain(evoChainData, pName);
            let html = '';

            // Breadcrumb
            if (evoInfo && evoInfo.path.length > 1) {
                html += '<div class="breadcrumb">';
                evoInfo.path.forEach((pNode, idx) => {
                    if (idx > 0) html += '<span class="sep">→</span>';
                    if (idx === evoInfo.path.length - 1) {
                        html += `<span class="current">${pNode.name}</span>`;
                    } else {
                        html += `<a onclick="navigateTo('${pNode.name}')">${pNode.name}</a>`;
                    }
                });
                html += '</div>';
            }

            // Main card
            html += `
                <div class="result-card">
                    <div class="pokemon-header">
                        <img class="pokemon-sprite" src="${pSprite}" alt="${pName}">
                        <div class="pokemon-info">
                            <div class="pokemon-name">${pName}</div>
                            <div class="pokemon-id">#${String(pId).padStart(3, '0')}</div>
                            <div class="type-badges">
                                ${pTypes.map(t => `<span class="type-badge" style="background:${TYPE_COLORS[t] || '#888'}">${t}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="divider"></div>
                    <div class="evolution-section">
                        <h3><span class="icon">🧬</span> Evolution Chain</h3>
                        ${renderEvolutions(evoInfo, pName)}
                    </div>
                </div>
            `;

            resultsDiv.innerHTML = html;
        }

        function findEvolutionInChain(chainNode, targetName) {
            function traverse(node, currentPath) {
                currentPath = [...currentPath, { name: node.species_name }];
                if (node.species_name === targetName) {
                    return { path: currentPath, details: node.evolution_details, evolvesTo: node.evolves_to };
                }
                for (const child of node.evolves_to) {
                    const result = traverse(child, currentPath);
                    if (result) return result;
                }
                return null;
            }

            return traverse(chainNode, []);
        }

        function renderEvolutions(evoInfo, currentName) {
            if (!evoInfo || evoInfo.evolvesTo.length === 0) {
                return '<div class="no-evolution">✨ This Pokémon does not evolve.</div>';
            }

            let html = '';

            evoInfo.evolvesTo.forEach((evoTarget, idx) => {
                const details = evoTarget.evolution_details;
                const targetName = evoTarget.species.name;

                // Get method summary
                const methodSummary = getMethodSummary(details);
                const methodDetails = getMethodDetails(details);

                html += `
                    <div class="evo-branch">
                        <div class="evo-row">
                            <div class="evo-card">
                                <div class="evo-name-row" id="evoNameRow-${idx}">
                                    <span class="evo-hidden-text" id="evoHiddenText-${idx}">Evolution Name</span>
                                    <span style="display:none;" id="evoTargetSpan-${idx}">
                                        <a class="evo-target-name" onclick="navigateTo('${targetName}')">${targetName}</a>
                                    </span>
                                    <button class="btn-reveal-evo" onclick="toggleEvoReveal(${idx}, '${targetName}')" id="evoToggleBtn-${idx}">
                                        👁️
                                    </button>
                                </div>
                                <div class="evo-method">
                                    <span class="method-label">Method:</span> ${methodSummary}
                                </div>
                                <div class="spoiler-content" id="spoiler-${idx}">
                                    ${methodDetails}
                                </div>
                                <button class="btn-reveal" onclick="toggleSpoiler(${idx})" id="triggerRevealBtn-${idx}">
                                    🔍 Reveal Trigger Requirement
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            return html;
        }

        function renderEvolutions(evoInfo) {
            if (!evoInfo || evoInfo.evolvesTo.length === 0) {
                return '<div class="no-evolution">✨ This Pokémon does not evolve.</div>';
            }

            let html = '';

            evoInfo.evolvesTo.forEach((evoTarget, idx) => {
                const targetName = evoTarget.species_name;
                const methodSummary = getMethodSummary(evoTarget.evolution_details);
                const methodDetails = getMethodDetails(evoTarget.evolution_details);
                html += `
                    <div class="evo-branch">
                        <div class="evo-row">
                            <div class="evo-card">
                                <div class="evo-name-row" id="evoNameRow-${idx}">
                                    <span class="evo-hidden-text" id="evoHiddenText-${idx}">Evolution Name</span>
                                    <span style="display:none;" id="evoTargetSpan-${idx}">
                                        <a class="evo-target-name" onclick="navigateTo('${targetName}')">${targetName}</a>
                                    </span>
                                    <button class="btn-reveal-evo" onclick="toggleEvoReveal(${idx}, '${targetName}')" id="evoToggleBtn-${idx}">
                                        👁️
                                    </button>
                                </div>
                                <div class="evo-method">
                                    <span class="method-label">Method:</span> ${methodSummary}
                                </div>
                                <div class="spoiler-content" id="spoiler-${idx}">
                                    ${methodDetails}
                                </div>
                                <button class="btn-reveal" onclick="toggleSpoiler(${idx})" id="triggerRevealBtn-${idx}">
                                    🔍 Reveal Trigger Requirement
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            return html;
        }

        function toggleEvoReveal(idx, targetName) {
            const hiddenText = document.getElementById(`evoHiddenText-${idx}`);
            const targetSpan = document.getElementById(`evoTargetSpan-${idx}`);
            const toggleBtn = document.getElementById(`evoToggleBtn-${idx}`);

            if (hiddenText.style.display !== 'none') {
                // Reveal
                hiddenText.style.display = 'none';
                targetSpan.style.display = 'inline';
                toggleBtn.innerHTML = '🙈';

                // I'm not sure if I prefer the button toggling or not.
                toggleBtn.style.display = 'none';
            } else {
                // Hide
                hiddenText.style.display = 'inline';
                targetSpan.style.display = 'none';
                toggleBtn.innerHTML = '👁️';
            }
        }

        function getMethodSummary(details) {
            if (!details || details.length === 0) return 'Unknown method';

            const parts = [];
            details.forEach(d => {
                if (d.trigger) {
                    const trigger = d.trigger;
                    switch (trigger) {
                        case 'level-up':
                            parts.push('Level up');
                            break;
                        case 'trade':
                            parts.push('Trade');
                            break;
                        case 'use-item':
                            parts.push('Use item');
                            break;
                        case 'shed':
                            parts.push('Shed');
                            break;
                        case 'spin':
                            parts.push('Spin');
                            break;
                        case 'tower-of-darkness':
                            parts.push('Tower of Darkness');
                            break;
                        case 'tower-of-waters':
                            parts.push('Tower of Waters');
                            break;
                        case 'three-critical-hits':
                            parts.push('Critical hits');
                            break;
                        case 'take-damage':
                            parts.push('Take damage');
                            break;
                        case 'other':
                            parts.push('Other');
                            break;
                        case 'agile-style-move':
                            parts.push('Agile style move');
                            break;
                        case 'strong-style-move':
                            parts.push('Strong style move');
                            break;
                        case 'recoil-damage':
                            parts.push('Recoil damage');
                            break;
                        default:
                            parts.push(trigger.replace(/-/g, ' '));
                    }
                }
            });

            return parts.join(', ');
        }

        function getMethodDetails(details) {
            if (!details || details.length === 0) return 'No additional details available.';

            const lines = [];
            details.forEach(d => {
                if (d.min_level) lines.push(`<strong>Level:</strong> ${d.min_level}`);
                if (d.item) {
                    const itemName = d.item.name.replace(/-/g, ' ');
                    lines.push(`<strong>Item:</strong> ${itemName}`);
                }
                if (d.known_move) {
                    lines.push(`<strong>Must know move:</strong> ${d.known_move.name.replace(/-/g, ' ')}`);
                }
                if (d.known_move_type) {
                    lines.push(`<strong>Must know a move of type:</strong> ${d.known_move_type.name}`);
                }
                if (d.trade_species) {
                    lines.push(`<strong>Trade while holding:</strong> ${d.trade_species.name.replace(/-/g, ' ')}`);
                }
                if (d.trigger && d.trigger.name === 'trade') {
                    if (!d.item && !d.trade_species) {
                        lines.push('<strong>Trade with another player</strong>');
                    }
                }
                if (d.min_happiness !== null && d.min_happiness !== undefined) {
                    lines.push(`<strong>Happiness:</strong> ${d.min_happiness} or higher`);
                }
                if (d.min_beauty !== null && d.min_beauty !== undefined) {
                    lines.push(`<strong>Beauty:</strong> ${d.min_beauty} or higher`);
                }
                if (d.min_affection !== null && d.min_affection !== undefined) {
                    lines.push(`<strong>Affection:</strong> ${d.min_affection} or higher`);
                }
                if (d.needs_overworld_rain !== null && d.needs_overworld_rain !== undefined && d.needs_overworld_rain) {
                    lines.push('<strong>Needs overworld rain</strong>');
                }
                if (d.time_of_day) {
                    lines.push(`<strong>Time of day:</strong> ${d.time_of_day}`);
                }
                if (d.relative_physical_stats !== null && d.relative_physical_stats !== undefined) {
                    if (d.relative_physical_stats > 0) lines.push('<strong>Attack &gt; Defense</strong>');
                    else if (d.relative_physical_stats < 0) lines.push('<strong>Defense &gt; Attack</strong>');
                    else lines.push('<strong>Attack = Defense</strong>');
                }
                if (d.party_type) {
                    lines.push(`<strong>Party type:</strong> ${d.party_type.replace(/-/g, ' ')}`);
                }
                if (d.party_species) {
                    lines.push(`<strong>With ${d.party_species.name.replace(/-/g, ' ')} in party</strong>`);
                }
                if (d.gender && d.gender > 0) {
                    lines.push('<strong>Gender:</strong> Female only');
                }
                if (d.location) {
                    const locName = d.location.name.replace(/-/g, ' ');
                    lines.push(`<strong>Location:</strong> ${locName}`);
                }
                if (d.held_item) {
                    lines.push(`<strong>Held item:</strong> ${d.held_item.name.replace(/-/g, ' ')}`);
                }
                if (d.turn_upside_down) {
                    lines.push('<strong>Turn 3DS upside down</strong>');
                }
            });
            return lines.length === 0 ? 'No additional details available.' : lines.join('<br>');
        }

        function toggleSpoiler(idx) {
            const spoiler = document.getElementById(`spoiler-${idx}`);
            spoiler.classList.toggle('visible');

            const btnReveal = document.getElementById(`triggerRevealBtn-${idx}`);
            btnReveal.style.display = 'none';
        }
    </script>
</body>
</html>
