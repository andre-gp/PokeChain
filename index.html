<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéChain</title>
    <link href="https://cdn.jsdelivr.net/npm/fontsource-inter@5.0.16/index.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="team-builder.css">
    <link rel="icon" type="image/png" href="./favicon/favicon-96x96.png?" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg?" />
    <link rel="shortcut icon" href="./favicon/favicon.ico?" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png?" />
    <link rel="manifest" href="./favicon/site.webmanifest?" />
</head>
<body>
    <div class="container">
        <header>
            <div class="logo" onclick="navigateTo('')">PokéChain</div>
            <div class="subtitle">Spoiler-free evolution chain tracker</div>
            <button class="settings-btn team-builder-btn" id="teamBuilderBtn" onclick="toggleTeamBuilder()" aria-label="Team Builder" style="display:none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2"/>
                    <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
                    <line x1="12" y1="12" x2="12" y2="16"/>
                    <line x1="10" y1="14" x2="14" y2="14"/>
                </svg>
            </button>
            <button class="settings-btn" id="settingsBtn" onclick="openSettings()" aria-label="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>

            <!-- First-visit tutorial tooltip (spotlights the settings button) -->
            <div class="tutorial-tip" id="tutorialTip" role="dialog" aria-labelledby="tutorialTipTitle">
                <div class="tutorial-tip-title" id="tutorialTipTitle">Configure the spoiler level</div>
                <p class="tutorial-tip-text">
                    Open the <strong>Settings</strong> to decide how much is shown up front.
                </p>
            </div>
        </header>

        <div class="search-wrapper">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" class="search-input" id="searchInput" placeholder="Search a Pokémon..." autocomplete="off" spellcheck="false">
            <div class="search-spinner" id="searchSpinner"><div class="spinner"></div></div>
            <div class="suggestions" id="suggestions"></div>
        </div>

        <div class="error-msg" id="errorMsg"></div>
        <div id="results"></div>

        <!-- Team Builder View (inline, replaces main content) -->
        <div id="teamBuilderView" style="display:none;">
            <div class="tb-view-tabs-row">
                <div class="team-builder-tabs" id="teamBuilderTabs"></div>
                <button class="settings-btn tb-edit-mode-btn" id="tbEditModeBtn"
                    onclick="toggleTbEditMode()" title="Edit team" aria-label="Edit mode">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                    </svg>
                </button>
                <button class="btn-reveal tb-new-team-btn" onclick="createNewTeam()">+ New Team</button>
            </div>
            <div id="tbSaveBar" class="tb-save-bar">
                <span class="tb-unsaved-label">Unsaved changes</span>
                <div class="tb-save-bar-actions">
                    <button class="btn-reveal tb-revert-btn" onclick="tbConfirmRevert()">Revert</button>
                    <button class="btn-reveal tb-save-btn" onclick="tbConfirmSave()">Save</button>
                </div>
            </div>
            <div id="teamBuilderBody"></div>
        </div>
    </div>

    <!-- First-visit tutorial overlay -->
    <div id="tutorialOverlay" class="tutorial-overlay"></div>

    <!-- Pokemon Artwork Lightbox -->
    <div id="pokemonLightbox" class="pokemon-lightbox" role="dialog" aria-modal="true"
        aria-labelledby="pokemonLightboxName" aria-hidden="true" onclick="handlePokemonLightboxBackdrop(event)">
        <div class="pokemon-lightbox-glow" aria-hidden="true"></div>
        <div class="pokemon-lightbox-content">
            <button class="pokemon-lightbox-close" type="button" onclick="closePokemonImage()"
                aria-label="Close enlarged Pokémon artwork">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
                    <line x1="6" y1="6" x2="18" y2="18" />
                    <line x1="18" y1="6" x2="6" y2="18" />
                </svg>
            </button>
            <img id="pokemonLightboxImage" class="pokemon-lightbox-image" src="" alt="">
            <div class="pokemon-lightbox-caption">                
                <span id="pokemonLightboxName" class="pokemon-lightbox-name"></span>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="type-modal" onclick="closeSettings()">
        <div class="type-modal-content settings-modal-content" onclick="event.stopPropagation()">
            <span class="type-modal-close" onclick="closeSettings()">&times;</span>
            <h2>Settings</h2>
            <div class="settings-section">
                <div class="settings-section-title">Pokémon</div>
                <label class="toggle-wrapper">
                    <input type="checkbox" id="settingAutocomplete" checked>
                    <span class="toggle-track"></span>
                    <span>Enable autocomplete<button type="button" class="setting-help" aria-label="What is this?"
                        data-tooltip="Suggests Pokémon names as you search.">?</button></span>
                </label>
                <label class="toggle-wrapper">
                    <input type="checkbox" id="settingAlwaysShowForms">
                    <span class="toggle-track"></span>
                    <span>Always show other forms</span>
                </label>
            </div>
            <div class="settings-section">
                <div class="settings-section-title">Evolution</div>
                <label class="toggle-wrapper">
                    <input type="checkbox" id="settingCrossGenExact" checked>
                    <span class="toggle-track"></span>
                    <span>Show exact generation on cross-gen evolutions<button type="button" class="setting-help" aria-label="What is this?"
                        data-tooltip="Some Pokémon only got an evolution in a later generation, these are marked with a badge. When this is on, the badge shows the exact generation it was introduced in.">?</button></span>
                </label>
            </div>
            <div class="settings-section">
                <div class="settings-section-title">Info</div>
                <label class="toggle-wrapper">
                    <input type="checkbox" id="settingAlwaysShowDetails">
                    <span class="toggle-track"></span>
                    <span>Always show base stats and abilities</span>
                </label>
                <label class="toggle-wrapper">
                    <input type="checkbox" id="settingDetailedAbility">
                    <span class="toggle-track"></span>
                    <span>Show detailed ability description</span>
                </label>
                <label class="toggle-wrapper">
                    <input type="checkbox" id="settingShowHW">
                    <span class="toggle-track"></span>
                    <span>Show height &amp; weight</span>
                </label>
            </div>
            <div class="settings-section">
                <div class="settings-section-title">Experimental</div>
                <label class="toggle-wrapper">
                    <input type="checkbox" id="settingTeamBuilder">
                    <span class="toggle-track"></span>
                    <span>Enable Team Building<button type="button" class="setting-help" aria-label="What is this?"
                        data-tooltip="WIP ~ I don't recommend activating this :)">?</button></span>
                </label>
            </div>
        </div>
    </div>

    <!-- Move Info Modal -->
    <div id="moveInfoModal" class="type-modal" onclick="closeMoveInfoModal()">
        <div class="type-modal-content" onclick="event.stopPropagation()">
            <span class="type-modal-close" onclick="closeMoveInfoModal()">&times;</span>
            <div id="moveInfoBody"></div>
        </div>
    </div>

    <!-- Type Details Modal -->
    <div id="typeModal" class="type-modal">
        <div class="type-modal-content">
            <span class="type-modal-close" onclick="closeTypeModal()">&times;</span>
            <h2 id="typeModalTitle">Type Details</h2>
            <div id="typeModalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="team-builder.js"></script>
</body>
</html>
